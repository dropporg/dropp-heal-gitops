apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phpmyadmin
  namespace: heal
spec:
  interval: 30m
  chart:
    spec:
      chart: phpmyadmin
      version: "20.0.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    # Same 2025 Bitnami image move as MySQL.
    image:
      registry: docker.io
      repository: bitnamilegacy/phpmyadmin
      tag: 5.2.2-debian-12-r22
    global:
      security:
        allowInsecureImages: true
    db:
      # The Service the MySQL release creates.
      host: mysql
      port: 3306
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 384Mi
