# The InfluxDB UI, so the time-series data can be queried. It has no auth of
# its own beyond the admin token, so it is reachable only through the cluster
# Gateway on a private hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: influxdb
  namespace: heal
spec:
  parentRefs:
    - name: heal-gateway
      namespace: envoy-gateway-system
  hostnames:
    - influx-dev.heal.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: influxdb-influxdb2
          port: 8086
