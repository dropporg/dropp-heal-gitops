apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: influxdb
  namespace: heal
spec:
  interval: 30m
  chart:
    spec:
      chart: influxdb2
      version: "2.1.2"
      sourceRef:
        kind: HelmRepository
        name: influxdata
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    adminUser:
      organization: heal
      bucket: heal
      user: admin
      # Keys admin-password and admin-token, the names this chart looks for. The
      # token is the same value heal-credentials gives the application.
      existingSecret: influxdb-credentials
    # Same as MySQL: the chart's probe defaults allow one second, which a
    # loaded node does not always meet.
    livenessProbe:
      path: /health
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 6
    readinessProbe:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 15
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
    service:
      port: 8086
